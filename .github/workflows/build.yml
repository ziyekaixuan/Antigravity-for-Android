name: Build Antigravity

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '同时发布为 Release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build and sign both editions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt zipalign apksigner file zip unzip gzip

      - name: Read version
        id: ver
        run: |
          V=$(grep '^APP_VERSION_NAME=' config/app.env | head -1 | cut -d= -f2)
          C=$(grep '^APP_VERSION_CODE=' config/app.env | head -1 | cut -d= -f2)
          CORE=$(grep '^CORE_VERSION=' config/app.env | head -1 | cut -d= -f2)
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "core=$CORE" >> "$GITHUB_OUTPUT"
          echo "Building Antigravity $V ($C), core $CORE"

      - name: Run module tests
        run: |
          bash modules/env/tests/run_all.sh
          bash modules/io/tests/run_all.sh
          bash modules/builder/tests/run_all.sh

      - name: Cache patched core
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/agy_cache
          key: patched-core-${{ hashFiles('modules/core/pristine/language_server.tar.gz', 'modules/patches/**', 'modules/runner/prepare_runtime.py') }}

      - name: Build standard edition
        env:
          AGY_CACHE_DIR: ${{ runner.temp }}/agy_cache
        run: bash build.sh

      - name: Build region-bypass edition
        env:
          AGY_CACHE_DIR: ${{ runner.temp }}/agy_cache
        run: bash build.sh --region-bypass

      - name: Sign with the release key (from Secrets)
        env:
          KS1: ${{ secrets.KS_B64_1 }}
          KS2: ${{ secrets.KS_B64_2 }}
          KS3: ${{ secrets.KS_B64_3 }}
          KS4: ${{ secrets.KS_B64_4 }}
          KS5: ${{ secrets.KS_B64_5 }}
          KS6: ${{ secrets.KS_B64_6 }}
          KS7: ${{ secrets.KS_B64_7 }}
          KS8: ${{ secrets.KS_B64_8 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          B64=""
          for i in 1 2 3 4 5 6 7 8; do
            var="KS$i"
            v="$(printf '%s' "${!var}" | tr -d '[:space:]')"
            echo "chunk $i sha256: $(printf '%s' "$v" | sha256sum | cut -d' ' -f1)"
            B64="$B64$v"
          done
          echo "keystore b64 length: $(printf '%s' "$B64" | wc -c)"
          printf '%s' "$B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ea5278e5254ae5f24d72f1e200cbe3263749e9ee4605b37be8b74234e9d4a1c8  $RUNNER_TEMP/release.p12" | sha256sum -c -
          V="${{ steps.ver.outputs.name }}"
          apksigner sign --ks "$RUNNER_TEMP/release.p12" --ks-key-alias "$KEY_ALIAS" --ks-pass pass:"$KEYSTORE_PASSWORD" --key-pass pass:"$KEY_PASSWORD" --out "Antigravity-$V-standard.apk" dist/antigravity.apk
          apksigner sign --ks "$RUNNER_TEMP/release.p12" --ks-key-alias "$KEY_ALIAS" --ks-pass pass:"$KEYSTORE_PASSWORD" --key-pass pass:"$KEY_PASSWORD" --out "Antigravity-$V-region-bypass.apk" dist/antigravity-region-bypass.apk
          rm -f "$RUNNER_TEMP/release.p12"
          apksigner verify --print-certs "Antigravity-$V-standard.apk" | head -3
          apksigner verify --print-certs "Antigravity-$V-region-bypass.apk" | head -3
          sha256sum "Antigravity-$V-standard.apk" "Antigravity-$V-region-bypass.apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ownagy-${{ steps.ver.outputs.name }}
          path: |
            Antigravity-*.apk
            SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Antigravity ${{ steps.ver.outputs.name }}
          make_latest: true
          files: |
            Antigravity-*.apk
            SHA256SUMS.txt
          body: |
            Antigravity ${{ steps.ver.outputs.name }}（官方核心 ${{ steps.ver.outputs.core }}）

            | 文件 | 说明 |
            | :--- | :--- |
            | `Antigravity-${{ steps.ver.outputs.name }}-region-bypass.apk` | 绕区版 |
            | `Antigravity-${{ steps.ver.outputs.name }}-standard.apk` | 标准版 |
            | `SHA256SUMS.txt` | 校验和 |

            与旧版本签名一致，可直接覆盖安装.
